<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="The best discounts on JD Sports UK, updated every 5 minutes."
    />
    <title>Bargain</title>
    <!-- Sets the theme before first paint (no flash). Same rule as features/theme/themeStore.ts. -->
    <script>
      try {
        var t = localStorage.getItem("theme");
        if (t !== "light" && t !== "dark")
          t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
