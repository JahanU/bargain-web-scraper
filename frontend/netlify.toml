# Netlify's base directory is `frontend`, so these paths are relative to it.
[build]
command = "bun install --frozen-lockfile && bun run build"
publish = "dist"

[build.environment]
NODE_VERSION = "22"

# Single page app: every path serves index.html.
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"

# Hashed build output and self-hosted fonts never change in place.
[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/fonts/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
