# Bun's own configuration: https://bun.com/docs/runtime/bunfig

[install]
# Always the public npm registry, whatever a machine's global ~/.bunfig.toml or ~/.npmrc says,
# so the lockfile stays portable (it records non-default registries as full tarball URLs).
registry = "https://registry.npmjs.org/"
# `bun add` writes exact versions ("1.2.3", not "^1.2.3"), so installs are reproducible.
exact = true

[test]
preload = ["./test/setup.ts"]
# Only measure the app's code, not the tests themselves.
coverageSkipTestFiles = true
# `bun run test:coverage` fails if coverage drops below these.
coverageThreshold = { lines = 0.95, functions = 0.85 }
